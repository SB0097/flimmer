name: Repair Expo SDK dependencies (temporary)

on:
  push:
    branches: [integration/takeout-m5-into-test]
    paths:
      - .github/workflows/repair-expo-deps.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/takeout-m5-into-test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Align dependencies with installed Expo SDK
        run: npx expo install --fix --npm
      - name: Validate changes
        run: |
          npx --yes expo-doctor
          npm run typecheck
          npm run lint
          npm run format:check
          npm test -- --ci
      - name: Commit validated dependency changes
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit -m 'fix: align Expo SDK 58 dependencies'
            git push origin HEAD:integration/takeout-m5-into-test
          fi
